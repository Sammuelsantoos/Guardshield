services:
  postgres:
    image: postgres:16-alpine
    container_name: guardshield-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardshield}
      POSTGRES_DB: ${POSTGRES_DB:-guardshield}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - guardshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardshield}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: guardshield-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./:/app
    command: sleep infinity

volumes:
  guardshield_pgdata:
